[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jax-mppi"
version = "0.3.1"
description = "MPPI (Model Predictive Path Integral) control in JAX"
readme = "README.md"
authors = [
    { name = "Riccardo Enrici", email = "riccardo.enrici@gmail.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "numpy>=1.24",
    "jaxtyping>=0.2.20",
    "chex>=0.1.80",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
    "matplotlib>=3.8.0",
]
autotuning = [
    "cma>=3.3.0",
    "evosax>=0.1.4",
]
autotuning-extra = [
    "ray[tune]>=2.9.0",
    "hyperopt>=0.2.7",
    "ribs>=0.5.0",
    "bayesian-optimization>=1.4.3",
]
docs = [
    "quarto>=0.1.0",
    "jupyter>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jax_mppi"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.basedpyright]
include = ["src", "examples"]
exclude = [".pixi", ".venv", "tests", "examples"]
reportMissingImports = false
reportMissingTypeStubs = false
